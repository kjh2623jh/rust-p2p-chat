name: Release desktop clients

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Test and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - name: Test all targets
        run: cargo test --locked --all-targets --all-features

      - name: Verify tag matches Cargo version
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Verify server has no client feature dependency
        run: cargo build --locked --release --no-default-features --bin server

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build-windows:
    name: Build Windows x86_64
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Build client
        run: cargo build --locked --release --features client --bin client

      - name: Prepare asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null
          $asset = "dist/p2p-chat-$env:GITHUB_REF_NAME-windows-x86_64.exe"
          Copy-Item "target/release/client.exe" $asset

      - name: Attest Windows executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.exe

      - name: Upload Windows asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64
          path: dist/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal DMG
    needs: validate
    runs-on: macos-15-intel
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_BASE64"
          test -n "$API_KEY_ID"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          echo "$API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build both macOS architectures
        run: |
          set -euo pipefail
          cargo build --locked --release --features client --bin client \
            --target aarch64-apple-darwin
          cargo build --locked --release --features client --bin client \
            --target x86_64-apple-darwin

      - name: Create and sign Universal app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_BUNDLE_ID"
          APP_DIR="dist/P2P Chat.app"
          EXECUTABLE="$APP_DIR/Contents/MacOS/p2p-chat"
          PLIST="$APP_DIR/Contents/Info.plist"
          ARM64_BINARY="target/aarch64-apple-darwin/release/client"
          X86_64_BINARY="target/x86_64-apple-darwin/release/client"
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p "$APP_DIR/Contents/MacOS"
          test -x "$ARM64_BINARY"
          test -x "$X86_64_BINARY"
          lipo -create "$ARM64_BINARY" "$X86_64_BINARY" -output "$EXECUTABLE"
          lipo "$EXECUTABLE" -verify_arch arm64 x86_64
          lipo -info "$EXECUTABLE"
          chmod +x "$EXECUTABLE"
          /usr/bin/plutil -create xml1 "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string ko" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string P2P Chat" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string p2p-chat" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $APPLE_BUNDLE_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string P2P Chat" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 11.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST"
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          codesign -dvv "$APP_DIR" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"

      - name: Notarize and staple app bundle
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$API_ISSUER_ID"
          APP_DIR="dist/P2P Chat.app"
          SUBMISSION="$RUNNER_TEMP/p2p-chat-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$SUBMISSION"
          xcrun notarytool submit "$SUBMISSION" --wait \
            --key "$API_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          xcrun stapler staple "$APP_DIR"
          xcrun stapler validate "$APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          spctl --assess --type execute --verbose=2 "$APP_DIR"

      - name: Create, sign, notarize, and staple DMG
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$API_ISSUER_ID"
          test -n "$APPLE_SIGNING_IDENTITY"
          APP_DIR="dist/P2P Chat.app"
          DMG_ROOT="$RUNNER_TEMP/p2p-chat-dmg"
          DMG_PATH="dist/p2p-chat-$GITHUB_REF_NAME-macos-universal.dmg"

          mkdir -p "$DMG_ROOT"
          ditto "$APP_DIR" "$DMG_ROOT/P2P Chat.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "P2P Chat" -srcfolder "$DMG_ROOT" \
            -ov -format UDZO "$DMG_PATH"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --wait \
            --key "$API_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$DMG_PATH"

      - name: Attest macOS disk image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.dmg

      - name: Upload macOS asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  release:
    name: Create draft GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum p2p-chat-* > SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          --verify-tag
          --draft
